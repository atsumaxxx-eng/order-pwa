<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Attendance</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .bar{ display:flex; gap:8px; align-items:flex-end; margin-bottom:14px; }
    .fc{ padding:10px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; }
    .btn{ border:0; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:800; background:var(--navy); color:#fff; cursor:pointer; font-family:inherit; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:9px 8px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    td.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .est{ font-weight:900; color:#16a34a; }
    .hint{ color:var(--text-3); font-size:13px; }
  </style>
</head>
<body>
  <div class="head"><h1>🕐 勤怠管理</h1><a class="hbtn" href="./manage.html">← 管理へ</a></div>
  <div class="wrap"><div class="card">
    <div class="bar">
      <div style="flex:1;"><label class="hint">対象月</label><br><input type="month" id="month" class="fc" style="width:100%;"></div>
      <button class="btn" onclick="load()">🔍 表示</button>
    </div>
    <div class="hint" style="margin-bottom:8px;">労働時間・残業（8時間超）・深夜（22-5時）・出勤日数・給与概算を集計します。概算＝時給×労働時間。</div>
    <div style="overflow:auto;">
      <table><thead><tr><th>従業員</th><th style="text-align:right;">出勤日</th><th style="text-align:right;">労働</th><th style="text-align:right;">残業</th><th style="text-align:right;">深夜</th><th style="text-align:right;">時給</th><th style="text-align:right;">概算</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;">月を選んで表示</td></tr></tbody></table>
    </div>
  </div></div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SYM='₱';
    function hm(min){ min = Math.round(Number(min)||0); var h=Math.floor(min/60), m=min%60; return h+':'+('0'+m).slice(-2); }

    window.load = function(){
      var month = document.getElementById('month').value; if(!month) return;
      document.getElementById('rows').innerHTML = '<tr><td colspan="7" style="padding:14px;">読み込み中…</td></tr>';
      rpc('getAttendanceMonthlySummary',[month]).then(function(list){
        list = (list||[]).filter(function(e){ return e.days>0 || e.workedMin>0; }).sort(function(a,b){ return (b.estimate||0)-(a.estimate||0); });
        if (!list.length){ document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;">この月の勤怠データはありません</td></tr>'; return; }
        document.getElementById('rows').innerHTML = list.map(function(e){
          return '<tr><td>'+esc(e.name)+'</td>'+
            '<td class="num">'+(e.days||0)+'</td>'+
            '<td class="num">'+hm(e.workedMin)+'</td>'+
            '<td class="num">'+hm(e.overtimeMin)+'</td>'+
            '<td class="num">'+hm(e.nightMin)+'</td>'+
            '<td class="num">'+SYM+(Number(e.wage)||0).toLocaleString()+'</td>'+
            '<td class="num est">'+SYM+(Number(e.estimate)||0).toLocaleString()+'</td></tr>';
        }).join('');
      }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#b91c1c;padding:14px;">読み込みエラー: '+esc(e.message||e)+'</td></tr>'; });
    };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    document.getElementById('month').value = new Date().toISOString().slice(0,7);
    load();
  </script>
</body>
</html>
