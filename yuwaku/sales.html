<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Sales</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .chart-wrap{ height:220px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; }
    th{ font-size:11px; color:var(--text-3); }
    .form-label{ font-size:13px; font-weight:700; }
    .fc{ padding:10px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; }
    .btn{ border:0; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:800; background:var(--navy); color:#fff; cursor:pointer; font-family:inherit; }
    .hint{ color:var(--text-3); font-size:13px; }
    .row-click{ cursor:pointer; }
  </style>
</head>
<body>
  <div class="head"><h1>📊 売上管理</h1><a class="hbtn" href="./manage.html">← 管理へ</a></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title">📈 日別売上</div>
      <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
      <p id="noData" style="display:none;text-align:center;color:#aaa;padding:20px 0;"></p>
    </div>
    <div class="card">
      <div class="card-title">📅 月別サマリー</div>
      <div id="monthly"><div class="hint">読み込み中…</div></div>
    </div>
    <div class="card">
      <div class="card-title">🔎 分析（商品・時間帯・曜日）</div>
      <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:130px;"><label class="form-label">対象月</label><input type="month" id="anaMonth" class="fc" style="width:100%;"></div>
        <button class="btn" onclick="loadAnalytics()">🔍 分析</button>
      </div>
      <div id="anaSummary" class="hint" style="margin-bottom:10px;"></div>
      <div style="font-weight:800;margin:6px 0;">🏆 商品別（ABC分析）</div>
      <div style="overflow:auto;"><table id="anaItems"><tbody><tr><td style="color:#aaa;padding:14px;">—</td></tr></tbody></table></div>
      <div style="font-weight:800;margin:14px 0 6px;">🍱 カテゴリ別売上</div>
      <div style="overflow:auto;"><table id="anaCat"><tbody><tr><td style="color:#aaa;padding:14px;">—</td></tr></tbody></table></div>
      <div style="font-weight:800;margin:14px 0 6px;">🕐 時間帯別</div>
      <div style="height:180px;"><canvas id="hourChart"></canvas></div>
      <div style="font-weight:800;margin:16px 0 6px;">📅 曜日別</div>
      <div style="height:180px;"><canvas id="dowChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">🍽️ メニュー人気度スコア（直近30日）</div>
      <div class="hint" style="margin-bottom:8px;">直近30日の注文数量で算出（最も売れた商品=100）。低スコア・未売上はメニュー見直しの参考に。</div>
      <div id="popList" style="overflow:auto;"><div class="hint">読み込み中…</div></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SYM = '₱';
    function money(v){ return SYM + (Number(v)||0).toLocaleString(); }
    var dailyChart, hourChart, dowChart;

    function renderSales(data){
      if (!data || !data.daily || !data.daily.length){ document.getElementById('noData').style.display='block'; document.getElementById('noData').innerText='売上データがありません。'; document.getElementById('monthly').innerHTML='<div class="hint">データなし</div>'; return; }
      var labels = data.daily.map(function(r){ return r.date; });
      var totals = data.daily.map(function(r){ return r.total; });
      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(document.getElementById('dailyChart').getContext('2d'), {
        type:'line', data:{ labels:labels, datasets:[{ label:'日別売上', data:totals, borderColor:'#c62828', backgroundColor:'rgba(198,40,40,0.12)', fill:true, tension:0.3, pointBackgroundColor:'#c62828' }] },
        options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, ticks:{ callback:function(v){ return money(v); } } } } }
      });
      var mh = '<table><thead><tr><th>月</th><th style="text-align:right;">合計</th></tr></thead><tbody>';
      data.monthly.forEach(function(r){ mh += '<tr><td>'+esc(r.month)+'</td><td style="text-align:right;"><strong>'+money(r.total)+'</strong></td></tr>'; });
      mh += '</tbody></table>';
      document.getElementById('monthly').innerHTML = mh;
    }

    window.loadAnalytics = function(){
      var month = document.getElementById('anaMonth').value; if(!month) return;
      document.getElementById('anaItems').innerHTML = '<tbody><tr><td style="padding:14px;">読み込み中…</td></tr></tbody>';
      rpc('getSalesAnalytics',[month]).then(renderAnalytics).catch(function(e){ document.getElementById('anaItems').innerHTML='<tbody><tr><td style="color:#b91c1c;padding:14px;">'+esc(e.message||e)+'</td></tr></tbody>'; });
    };
    function renderAnalytics(d){
      d = d || { items:[], byHour:[], byDow:[], total:0, count:0 };
      document.getElementById('anaSummary').innerText = '注文 '+d.count+'件 ・ 売上 '+money(d.total)+' ・ 客単価 '+money(d.avg||0)+' ・ 原価率 '+(d.costRate||0)+'%';
      var abc = { A:'#16a34a', B:'#f59e0b', C:'#94a3b8' };
      var html = '<thead><tr><th>商品</th><th style="text-align:right;">数量</th><th style="text-align:right;">売上</th><th style="text-align:right;">原価</th><th style="text-align:right;">原価率</th><th style="text-align:right;">累計比</th><th>ABC</th></tr></thead><tbody>';
      if (!d.items.length) html += '<tr><td colspan="7" style="color:#aaa;padding:14px;">データがありません</td></tr>';
      d.items.forEach(function(it){ html += '<tr><td>'+esc(it.name)+'</td><td style="text-align:right;">'+it.qty+'</td><td style="text-align:right;">'+money(it.revenue)+'</td><td style="text-align:right;color:var(--text-3);">'+money(it.cost||0)+'</td><td style="text-align:right;">'+(it.costRate||0)+'%</td><td style="text-align:right;">'+it.cumPct+'%</td><td><span style="background:'+(abc[it.abc]||'#94a3b8')+';color:#fff;font-weight:800;font-size:11px;padding:1px 8px;border-radius:999px;">'+it.abc+'</span></td></tr>'; });
      html += '</tbody>';
      document.getElementById('anaItems').innerHTML = html;
      var ch = '<thead><tr><th>カテゴリ</th><th style="text-align:right;">売上</th></tr></thead><tbody>';
      (d.byCategory||[]).forEach(function(c){ ch += '<tr><td>'+esc(c.category||'その他')+'</td><td style="text-align:right;">'+money(c.revenue)+'</td></tr>'; });
      if(!(d.byCategory||[]).length) ch += '<tr><td colspan="2" style="color:#aaa;padding:14px;">—</td></tr>';
      ch += '</tbody>'; document.getElementById('anaCat').innerHTML = ch;
      var hLabels = d.byHour.map(function(x){ return x.hour+'時'; });
      if (hourChart) hourChart.destroy();
      hourChart = new Chart(document.getElementById('hourChart').getContext('2d'), { type:'bar', data:{ labels:hLabels, datasets:[{ data:d.byHour.map(function(x){return x.revenue;}), backgroundColor:'#2563eb' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
      var dowNames = ['日','月','火','水','木','金','土'];
      if (dowChart) dowChart.destroy();
      dowChart = new Chart(document.getElementById('dowChart').getContext('2d'), { type:'bar', data:{ labels:dowNames, datasets:[{ data:d.byDow.map(function(x){return x.revenue;}), backgroundColor:'#16a34a' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
    }

    // 通貨記号
    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM = r.data.currencySymbol; }).catch(function(){});
    document.getElementById('anaMonth').value = new Date().toISOString().slice(0,7);
    rpc('getSalesSummary',[]).then(renderSales).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('monthly').innerHTML='<div style="color:#b91c1c;">読み込みエラー: '+esc(e.message||e)+'</div>'; });
    loadAnalytics();

    function renderPopularity(d){
      d = d || { items:[] };
      var lb = { hot:['🔥人気','#16a34a'], ok:['標準','#2563eb'], low:['⚠️低調','#f59e0b'], unsold:['❌未売上','#b91c1c'] };
      var html = '<table><thead><tr><th>#</th><th>商品</th><th>カテゴリ</th><th style="text-align:right;">数量</th><th>スコア</th><th></th></tr></thead><tbody>';
      if(!d.items.length){ html += '<tr><td colspan="6" style="color:#aaa;padding:14px;">データがありません</td></tr>'; }
      d.items.forEach(function(it,i){
        var l = lb[it.label]||lb.ok;
        var bar = '<div style="background:#eef1f5;border-radius:6px;height:10px;width:88px;overflow:hidden;display:inline-block;vertical-align:middle;"><div style="height:10px;width:'+it.score+'%;background:'+l[1]+';"></div></div> <span style="font-weight:800;">'+it.score+'</span>';
        html += '<tr><td>'+(i+1)+'</td><td>'+esc(it.name)+'</td><td style="color:var(--text-3);">'+esc(it.category)+'</td><td style="text-align:right;">'+it.qty+'</td><td>'+bar+'</td><td><span style="color:'+l[1]+';font-weight:800;font-size:12px;white-space:nowrap;">'+l[0]+'</span></td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('popList').innerHTML = html;
    }
    rpc('getMenuPopularity',[30]).then(renderPopularity).catch(function(e){ document.getElementById('popList').innerHTML='<div style="color:#b91c1c;">'+esc(e.message||e)+'</div>'; });
  </script>
</body>
</html>
