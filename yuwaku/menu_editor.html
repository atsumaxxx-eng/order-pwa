<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Menu Edit</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:800px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fg{ margin-bottom:8px; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:8px; }
    .btn-sm{ border:0; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:800; cursor:pointer; background:#eff6ff; color:#2563eb; }
    .mi{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .mi .thumb{ width:52px; height:52px; border-radius:9px; object-fit:cover; flex:0 0 52px; background:#e5e7eb; }
    .mi .nm{ font-weight:800; } .mi .meta{ font-size:12px; color:var(--text-3); }
    .off{ opacity:.5; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .muted{ color:var(--text-3); font-size:12px; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🍽️ メニュー編集</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="formTitle">➕ 商品の追加 / 編集</div>
      <input type="hidden" id="oldName">
      <div class="grid2">
        <div class="fg"><label class="form-label" data-t="lblName">商品名</label><input id="mName" class="fc"></div>
        <div class="fg"><label class="form-label" data-t="lblPrice">価格</label><input id="mPrice" type="number" min="0" class="fc"></div>
        <div class="fg"><label class="form-label" data-t="lblCat">カテゴリ</label><select id="mCat" class="fc" onchange="onCatSel('mCat','mCatNew')"></select><input id="mCatNew" class="fc" style="display:none;margin-top:6px;" placeholder="新規カテゴリ名" data-tph="phNewCat"></div>
        <div class="fg"><label class="form-label" data-t="lblStatus">ステータス</label><select id="mStatus" class="fc"><option value="販売中" data-t="onSale">販売中</option><option value="販売停止" data-t="stopped">販売停止</option></select></div>
        <div class="fg"><label class="form-label" data-t="lblNameEn">商品名（English）</label><input id="mNameEn" class="fc" placeholder="空欄なら自動翻訳" data-tph="phAuto"></div>
        <div class="fg"><label class="form-label" data-t="lblCatEn">カテゴリ（English）</label><select id="mCatEn" class="fc" onchange="onCatSel('mCatEn','mCatEnNew')"></select><input id="mCatEnNew" class="fc" style="display:none;margin-top:6px;" placeholder="空欄なら自動翻訳" data-tph="phAuto"></div>
      </div>
      <div class="muted" style="margin:-2px 0 8px;" data-t="enHint">英語欄は空でも保存時に自動翻訳され初期値が入ります（あとで編集可）。</div>
      <div class="fg"><label class="form-label" data-t="lblImg">画像（任意・変更時のみ選択）</label><input id="mFile" type="file" accept="image/*" class="fc"></div>
      <button class="btn btn-pri" id="saveBtn" onclick="save()" data-t="save">💾 保存</button>
      <button class="btn btn-sec" onclick="clearForm()" data-t="clear">クリア</button>
      <div class="alert" id="msg"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="listTitle">🍽️ 商品一覧</div>
      <div id="list"><div class="muted" data-t="loading">読み込み中…</div></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./i18n.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var MENU = [];

    // カテゴリ選択(select)を組み立てる。現在値は保持し、一覧にない値は追加。
    function fillCatSel(selId, cats){
      var sel=document.getElementById(selId); var cur=sel.value;
      var h='<option value="">'+I18n.t('catUnset')+'</option>';
      cats.forEach(function(c){ h+='<option value="'+esc(c)+'">'+esc(c)+'</option>'; });
      h+='<option value="__new__">'+I18n.t('catNew')+'</option>';
      sel.innerHTML=h;
      if(cur && cur!=='__new__' && cats.indexOf(cur)<0){ var o=document.createElement('option'); o.value=cur; o.textContent=cur; sel.insertBefore(o, sel.lastChild); }
      sel.value=cur;
    }
    function setCatSel(selId, newId, val){
      var sel=document.getElementById(selId), ni=document.getElementById(newId);
      ni.style.display='none'; ni.value=''; val=val||'';
      if(val && !Array.prototype.some.call(sel.options,function(o){return o.value===val;})){ var o=document.createElement('option'); o.value=val; o.textContent=val; sel.insertBefore(o, sel.lastChild); }
      sel.value=val;
    }
    window.onCatSel=function(selId,newId){ var isNew=document.getElementById(selId).value==='__new__'; var ni=document.getElementById(newId); ni.style.display=isNew?'block':'none'; if(isNew) ni.focus(); };

    function render(){
      var cats = [], catsEn = [];
      MENU.forEach(function(m){ var c=m['カテゴリ']; if(c && cats.indexOf(c)===-1) cats.push(c); var ce=m['カテゴリ_EN']; if(ce && catsEn.indexOf(ce)===-1) catsEn.push(ce); });
      fillCatSel('mCat', cats);
      fillCatSel('mCatEn', catsEn);
      if (!MENU.length){ document.getElementById('list').innerHTML='<div class="muted">'+I18n.t('noItems')+'</div>'; return; }
      document.getElementById('list').innerHTML = MENU.map(function(m,i){
        var off = (m['ステータス']!=='販売中');
        var st = off ? I18n.t('stopped') : I18n.t('onSale');
        var thumb = m.displayUrl ? '<img class="thumb" src="'+esc(m.displayUrl)+'" loading="lazy" alt="">' : '<div class="thumb"></div>';
        return '<div class="mi'+(off?' off':'')+'">'+thumb+'<div style="flex:1;"><div class="nm">'+esc(m['商品名'])+'</div>'+
          '<div class="meta">'+esc(m['カテゴリ']||'')+' ・ '+(SYM)+(Number(m['価格'])||0).toLocaleString()+' ・ '+st+'</div></div>'+
          '<button class="btn-sm" onclick="edit('+i+')">'+I18n.t('edit')+'</button>'+
          '<button class="btn-sm" style="background:#fee2e2;color:#b91c1c;margin-left:6px;" onclick="del('+i+')">'+I18n.t('del')+'</button></div>';
      }).join('');
    }
    var SYM='₱';
    window.del = function(i){
      var m = MENU[i]; if(!m) return;
      if(!confirm(m['商品名']+' — '+I18n.t('delConfirm'))) return;
      rpc('deleteMenuItem',[m['商品名']]).then(function(res){
        if(String(res).indexOf('Error')===0){ msg(I18n.t('errPrefix')+res, false); return; }
        msg(I18n.t('deleted'), true); if(document.getElementById('oldName').value===m['商品名']) clearForm();
        return rpc('getAllMenuForAdmin',[]).then(function(l){ MENU=l||[]; render(); });
      }).catch(function(e){ msg(I18n.t('errPrefix')+(e.message||e), false); });
    };
    window.edit = function(i){
      var m = MENU[i]; if(!m) return;
      document.getElementById('oldName').value = m['商品名'];
      document.getElementById('mName').value = m['商品名'];
      document.getElementById('mPrice').value = Number(m['価格'])||0;
      setCatSel('mCat','mCatNew', m['カテゴリ']||'');
      document.getElementById('mStatus').value = (m['ステータス']==='販売中'?'販売中':'販売停止');
      document.getElementById('mNameEn').value = m['商品名_EN']||'';
      setCatSel('mCatEn','mCatEnNew', m['カテゴリ_EN']||'');
      document.getElementById('mFile').value = '';
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.clearForm = function(){ ['oldName','mName','mPrice','mNameEn','mFile'].forEach(function(id){ document.getElementById(id).value=''; }); setCatSel('mCat','mCatNew',''); setCatSel('mCatEn','mCatEnNew',''); document.getElementById('mStatus').value='販売中'; document.getElementById('msg').style.display='none'; };
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }

    window.save = function(){
      var name = document.getElementById('mName').value.trim();
      if (!name){ msg(I18n.t('needName'), false); return; }
      var catSel=document.getElementById('mCat').value;
      var category=(catSel==='__new__')?document.getElementById('mCatNew').value.trim():catSel;
      var catEnSel=document.getElementById('mCatEn').value;
      var categoryEn=(catEnSel==='__new__')?document.getElementById('mCatEnNew').value.trim():catEnSel;
      var item = { oldName:document.getElementById('oldName').value, name:name, price:document.getElementById('mPrice').value,
        category:category, status:document.getElementById('mStatus').value, desc:'',
        nameEn:document.getElementById('mNameEn').value.trim(), categoryEn:categoryEn };
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      var file = document.getElementById('mFile').files[0];
      function send(fd){
        rpc('saveMenuItem',[item, fd]).then(function(res){ btn.disabled=false; if(String(res).indexOf('Error')===0){ msg(I18n.t('errPrefix')+res, false); return; } msg(I18n.t('saved'), true); clearForm(); return rpc('getAllMenuForAdmin',[]).then(function(l){ MENU=l||[]; render(); }); })
          .catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+(e.message||e), false); });
      }
      if (file){ var reader=new FileReader(); reader.onload=function(e){ send({ data:e.target.result.split(',')[1], type:file.type, name:file.name }); }; reader.readAsDataURL(file); }
      else { send(null); }
    };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    var __loaded=false;
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU=l||[]; __loaded=true; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('list').innerHTML='<div style="color:#b91c1c;">'+I18n.t('loadErr')+esc(e.message||e)+'</div>'; });

    I18n.init({
      ja:{ title:'🍽️ メニュー編集', back:'← 管理へ', formTitle:'➕ 商品の追加 / 編集', lblName:'商品名', lblPrice:'価格', lblCat:'カテゴリ', lblStatus:'ステータス', onSale:'販売中', stopped:'販売停止', lblNameEn:'商品名（English）', lblCatEn:'カテゴリ（English）', phAuto:'空欄なら自動翻訳', catUnset:'（未選択）', catNew:'＋ 新規カテゴリ…', phNewCat:'新規カテゴリ名', enHint:'英語欄は空でも保存時に自動翻訳され初期値が入ります（あとで編集可）。', lblImg:'画像（任意・変更時のみ選択）', save:'💾 保存', clear:'クリア', listTitle:'🍽️ 商品一覧', loading:'読み込み中…', noItems:'商品がありません', edit:'編集', del:'削除', delConfirm:'この商品を削除しますか？', deleted:'✅ 削除しました', needName:'商品名を入力してください', saved:'✅ 保存しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'🍽️ Menu Editor', back:'← Manage', formTitle:'➕ Add / Edit item', lblName:'Name', lblPrice:'Price', lblCat:'Category', lblStatus:'Status', onSale:'On sale', stopped:'Stopped', lblNameEn:'Name (English)', lblCatEn:'Category (English)', phAuto:'Auto-translated if blank', catUnset:'(none)', catNew:'＋ New category…', phNewCat:'New category name', enHint:'English fields are auto-translated on save if left blank (editable later).', lblImg:'Image (optional, only to change)', save:'💾 Save', clear:'Clear', listTitle:'🍽️ Menu items', loading:'Loading…', noItems:'No items', edit:'Edit', del:'Delete', delConfirm:'Delete this item?', deleted:'✅ Deleted', needName:'Please enter an item name', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded) render(); });
  </script>
</body>
</html>
