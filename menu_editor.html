<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Menu Edit</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:800px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fg{ margin-bottom:8px; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:8px; }
    .btn-sm{ border:0; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:800; cursor:pointer; background:#eff6ff; color:#2563eb; }
    .mi{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .mi .thumb{ width:52px; height:52px; border-radius:9px; object-fit:cover; flex:0 0 52px; background:#e5e7eb; }
    .mi .nm{ font-weight:800; } .mi .meta{ font-size:12px; color:var(--text-3); }
    .off{ opacity:.5; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .muted{ color:var(--text-3); font-size:12px; }
  </style>
</head>
<body>
  <div class="head"><h1>🍽️ メニュー編集</h1><a class="hbtn" href="./manage.html">← 管理へ</a></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title">➕ 商品の追加 / 編集</div>
      <input type="hidden" id="oldName">
      <div class="grid2">
        <div class="fg"><label class="form-label">商品名</label><input id="mName" class="fc"></div>
        <div class="fg"><label class="form-label">価格</label><input id="mPrice" type="number" min="0" class="fc"></div>
        <div class="fg"><label class="form-label">カテゴリ</label><input id="mCat" class="fc" list="catList"><datalist id="catList"></datalist></div>
        <div class="fg"><label class="form-label">ステータス</label><select id="mStatus" class="fc"><option value="販売中">販売中</option><option value="販売停止">販売停止</option></select></div>
      </div>
      <div class="fg"><label class="form-label">画像（任意・変更時のみ選択）</label><input id="mFile" type="file" accept="image/*" class="fc"></div>
      <button class="btn btn-pri" id="saveBtn" onclick="save()">💾 保存</button>
      <button class="btn btn-sec" onclick="clearForm()">クリア</button>
      <div class="alert" id="msg"></div>
    </div>
    <div class="card">
      <div class="card-title">🍽️ 商品一覧</div>
      <div id="list"><div class="muted">読み込み中…</div></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script>
    var TOKEN = localStorage.getItem('mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var MENU = [];

    function render(){
      var cats = [];
      MENU.forEach(function(m){ var c=m['カテゴリ']; if(c && cats.indexOf(c)===-1) cats.push(c); });
      document.getElementById('catList').innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('');
      if (!MENU.length){ document.getElementById('list').innerHTML='<div class="muted">商品がありません</div>'; return; }
      document.getElementById('list').innerHTML = MENU.map(function(m,i){
        var off = (m['ステータス']!=='販売中');
        var thumb = m.displayUrl ? '<img class="thumb" src="'+esc(m.displayUrl)+'" loading="lazy" alt="">' : '<div class="thumb"></div>';
        return '<div class="mi'+(off?' off':'')+'">'+thumb+'<div style="flex:1;"><div class="nm">'+esc(m['商品名'])+'</div>'+
          '<div class="meta">'+esc(m['カテゴリ']||'')+' ・ '+(SYM)+(Number(m['価格'])||0).toLocaleString()+' ・ '+esc(m['ステータス']||'')+'</div></div>'+
          '<button class="btn-sm" onclick="edit('+i+')">編集</button></div>';
      }).join('');
    }
    var SYM='₱';
    window.edit = function(i){
      var m = MENU[i]; if(!m) return;
      document.getElementById('oldName').value = m['商品名'];
      document.getElementById('mName').value = m['商品名'];
      document.getElementById('mPrice').value = Number(m['価格'])||0;
      document.getElementById('mCat').value = m['カテゴリ']||'';
      document.getElementById('mStatus').value = (m['ステータス']==='販売中'?'販売中':'販売停止');
      document.getElementById('mFile').value = '';
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.clearForm = function(){ ['oldName','mName','mPrice','mCat','mFile'].forEach(function(id){ document.getElementById(id).value=''; }); document.getElementById('mStatus').value='販売中'; document.getElementById('msg').style.display='none'; };
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }

    window.save = function(){
      var name = document.getElementById('mName').value.trim();
      if (!name){ msg('商品名を入力してください', false); return; }
      var item = { oldName:document.getElementById('oldName').value, name:name, price:document.getElementById('mPrice').value,
        category:document.getElementById('mCat').value, status:document.getElementById('mStatus').value, desc:'' };
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      var file = document.getElementById('mFile').files[0];
      function send(fd){
        rpc('saveMenuItem',[item, fd]).then(function(){ btn.disabled=false; msg('✅ 保存しました', true); clearForm(); return rpc('getAllMenuForAdmin',[]).then(function(l){ MENU=l||[]; render(); }); })
          .catch(function(e){ btn.disabled=false; msg('エラー: '+(e.message||e), false); });
      }
      if (file){ var reader=new FileReader(); reader.onload=function(e){ send({ data:e.target.result.split(',')[1], type:file.type, name:file.name }); }; reader.readAsDataURL(file); }
      else { send(null); }
    };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU=l||[]; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('list').innerHTML='<div style="color:#b91c1c;">読み込みエラー: '+esc(e.message||e)+'</div>'; });
  </script>
</body>
</html>
